---
- name: Install Docker and run container
  hosts: webservers
  become: true
  vars:
    image_name: harshitr007/devops-site
    image_tag: latest
    container_name: myapp
    host_port: 80
    container_port: 80

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      register: apt_result
      retries: 5
      delay: 10
      until: apt_result is succeeded

    - name: Install Docker and Python Docker SDK
      apt:
        name:
          - docker.io
          - python3-docker
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull image
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Run container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: always
        ports:
          - "{{ host_port }}:{{ container_port }}"
